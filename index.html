<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>教师工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#eef6f1,#e2efe8)}
.box{text-align:center;color:#2a4a3a;padding:32px}
.logo{font-size:22px;font-weight:700;margin-bottom:6px}
.spin{width:34px;height:34px;border:3px solid #bcd8c8;border-top-color:#1a9c5b;border-radius:50%;margin:18px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tip{font-size:13.5px;color:#5a7a6a;line-height:1.8}
#ldr{display:none;margin-top:16px;padding:9px 22px;border:0;border-radius:9px;background:#1a9c5b;color:#fff;font-size:14px;cursor:pointer}
#lde{color:#b3443f;font-size:13px;margin-top:10px;line-height:1.7}
.ver{margin-top:22px;font-size:12px;color:#93a89b}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🏫 教师工作台</div>
  <div class="spin"></div>
  <div class="tip" id="ldt">正在加载工作台，请稍候…<br>首次加载约 1MB，之后会快很多</div>
  <button id="ldr" onclick="location.reload()">🔄 重新加载</button>
  <div id="lde"></div>
  <div class="ver">v127 · 2.6.61</div>
</div>
<script>
/* 2.6.61 启动器：单文件应用 3.3MB，在慢速/不稳定链路上直接打开可能被截断，
   截断处的正则字面量会导致 "Invalid regular expression: missing /" 且无法自愈。
   改为这里用 fetch 拉取 app.html 并校验结尾完整（</html>），不完整自动重试，
   完整才 document.write 渲染 —— 永远不会出现"半截应用"。 */
(function () {
  var t = document.getElementById('ldt'), e = document.getElementById('lde'), b = document.getElementById('ldr');
  function say(s) { t.innerHTML = s }
  function fail(s) { e.innerHTML = s; b.style.display = 'inline-block' }
  function go(tries) {
    var u = 'app.html';
    u += (location.search ? location.search : '?v=127') + '&r=' + Date.now();
    say('正在加载工作台' + (tries ? '（第 ' + (tries + 1) + ' 次尝试）' : '') + '…');
    fetch(u, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (txt) {
      if (!/<\/html>\s*$/i.test(txt.slice(-400))) throw new Error('文件不完整（网络截断）');
      say('加载完成，正在启动…');
      document.open(); document.write(txt); document.close();
    }).catch(function (err) {
      if (tries < 4) { say('网络不稳，自动重试…'); setTimeout(function () { go(tries + 1) }, 1200) }
      else fail('⚠️ ' + err.message + '<br>请检查网络后点下方按钮重试');
    });
  }
  go(0);
})();
</script>
</body>
</html>
