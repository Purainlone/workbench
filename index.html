<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台已升级</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:linear-gradient(135deg,#e9faf0 0%,#f1fbf3 48%,#eff9f1 100%);
       min-height:100vh;display:flex;align-items:center;justify-content:center;color:#1f3a2e;padding:20px}
  .card{background:#fff;border-radius:18px;box-shadow:0 12px 30px rgba(40,150,110,.15);
        max-width:440px;width:100%;padding:32px 26px;text-align:center}
  .ic{font-size:46px;margin-bottom:4px}
  h1{font-size:20px;margin:8px 0 4px;color:#1f8a5f}
  p{font-size:14px;line-height:1.75;color:#5e8a72;margin:10px 0}
  .tag{display:inline-block;background:#e7f7ee;color:#1f9d6b;font-size:12px;
       padding:5px 13px;border-radius:20px;margin-top:6px}
  .foot{margin-top:18px;font-size:12px;color:#9bb3a6}
  b{color:#1f6e4d}
</style>
</head>
<body>
  <div class="card">
    <div class="ic">🌱</div>
    <h1>本工作台已升级为优化版</h1>
    <p>原「教师工作台（网页版）」已<b>暂时下线</b>。<br>请使用<b>优化版</b>继续访问与使用，原有功能与数据均已迁移保留。</p>
    <span class="tag">数据已完整保留，可随时恢复</span>
    <p class="foot">如需恢复旧版入口或获取优化版访问方式，请联系管理员。</p>
  </div>
</body>
</html>
